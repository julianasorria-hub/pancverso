name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Abrir o zip do site
        run: |
          mkdir -p _site
          if [ -f pancverso-melhorado.zip ]; then unzip -q -o pancverso-melhorado.zip -d _site; fi
          if [ ! -f _site/index.html ]; then
            d=$(dirname "$(find _site -name index.html | head -1)")
            cp -r "$d"/. _site/
          fi
          if [ -f CNAME ]; then cp CNAME _site/CNAME; fi
          touch _site/.nojekyll
          ls -la _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
